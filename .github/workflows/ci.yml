name: Sync
run-name: >-
  ${{ (inputs.mode == 'daily' || github.event.schedule == '20 0 2-31 * *') && 'Sync (daily)' ||
      (inputs.mode == 'month' || github.event.schedule == '20 0 1 * *') && 'Sync (month)' ||
      '' }}

on:
  schedule:
    - cron: "20 6,12,18 * * *"
    - cron: "20 0 2-31 * *"
    - cron: "20 0 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Select mode"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - daily
          - month

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Determine execution mode
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "20 0 1 * *" ]; then
            MODE="month"
          elif [ "${{ github.event.schedule }}" = "20 0 2-31 * *" ]; then
            MODE="daily"
          else
            MODE="default"
          fi
          echo "Selected mode: $MODE"
          echo "# Mode: $MODE" >> $GITHUB_STEP_SUMMARY
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          if [ "$MODE" != "default" ]; then
            echo "image_flag=--image" >> $GITHUB_OUTPUT
            echo "update_flag=--$MODE" >> $GITHUB_OUTPUT
          fi

      - name: Discover repositories
        run: python scripts/discover.py

      - name: Fetch new bundles
        id: fetch
        run: |
          python scripts/fetch.py ${{ steps.config.outputs.image_flag }}

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

          if [ -s scripts/bundle-parser/updated_files.txt ]; then
            echo "need_java=true" >> $GITHUB_OUTPUT
          else
            echo "need_java=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java environment
        if: steps.fetch.outputs.changed == 'true' && steps.fetch.outputs.need_java == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Parse bundles
        if: steps.fetch.outputs.changed == 'true' || steps.config.outputs.mode != 'default'
        run: python scripts/parse.py

      - name: Update bundles data
        if: steps.fetch.outputs.changed == 'true' || steps.config.outputs.mode != 'default'
        run: |
          pip install -e scripts/
          python scripts/update.py ${{ steps.config.outputs.update_flag }}

      - name: Generate What's New
        if: steps.config.outputs.mode != 'default'
        run: python scripts/whats_new.py

      - name: Commit and push changes
        id: commit
        run: |
          git add data/ web/public/
          if ! git diff --staged --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            if [ "${{ steps.config.outputs.mode }}" != "default" ] && git diff --staged --name-only | grep -q "web/public/whats-new.json"; then
              TAG=$(date -u +'%Y.%m.%d')
              git commit -m "Update history (${TAG})"
            else
              git commit -m "Sync bundles"
            fi

            git push origin HEAD:main
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        if: steps.config.outputs.mode != 'default' && steps.commit.outputs.changed == 'true' && hashFiles('scripts/temp/whats-new.md') != ''
        env:
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python scripts/telegram.py

      - name: Cleanup old workflow runs
        if: steps.config.outputs.mode != 'default'
        run: |
          gh run list -L 200 --json databaseId -q '.[].databaseId' | tail -n +91 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :
