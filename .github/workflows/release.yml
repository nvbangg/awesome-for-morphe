name: Generate Release

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and process data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/discover.py
          python scripts/fetch.py --image
          python scripts/parse.py

          pip install google-play-scraper
          DAY_OF_MONTH=$(date +%d)
          if [ "$DAY_OF_MONTH" -eq 1 ]; then
            python scripts/update.py --month
          else
            python scripts/update.py --daily
          fi

          python scripts/whats_new.py

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies and build
        run: |
          cd web
          npm ci
          npm run build

      - name: Commit and push changes
        id: commit
        run: |
          git add data/ docs/
          if ! git diff --staged --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            TAG=$(date -d "-12 hours" +'%Y.%m.%d')
            DAY=$(date -d "-12 hours" +'%B %-d')

            git commit -m "Update release history (${TAG})"
            git push origin HEAD:main

            echo "changed=true" >> $GITHUB_OUTPUT
            echo "TAG=${TAG}" >> $GITHUB_ENV
            echo "DAY=${DAY}" >> $GITHUB_ENV
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram release notification
        if: steps.commit.outputs.changed == 'true' && hashFiles('whats-new.md') != ''
        env:
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python scripts/telegram.py
