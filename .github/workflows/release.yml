name: Generate Release

on:
  schedule:
    - cron: "30 23 * * *"  
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch new bundles
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/discover.py
          python scripts/fetch.py --image
          if [ -s scripts/bundle-parser/updated_files.txt ]; then
            echo "need_java=true" >> $GITHUB_OUTPUT
          else
            echo "need_java=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java environment
        if: steps.fetch.outputs.need_java == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Parse bundles and update data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -e scripts/
          python scripts/parse.py

          DAY_OF_MONTH=$(date +%d)
          if [ "$DAY_OF_MONTH" -eq 1 ]; then
            python scripts/update.py --month
          else
            python scripts/update.py --daily
          fi

          python scripts/whats_new.py

      - name: Commit and push changes
        id: commit
        run: |
          git add data/ web/public/
          if ! git diff --staged --quiet; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            TAG=$(date -d "-12 hours" +'%Y.%m.%d')
            DAY=$(date -d "-12 hours" +'%B %-d')

            git commit -m "Update release history (${TAG})"
            git push origin HEAD:main

            echo "changed=true" >> $GITHUB_OUTPUT
            echo "TAG=${TAG}" >> $GITHUB_ENV
            echo "DAY=${DAY}" >> $GITHUB_ENV
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram release notification
        if: steps.commit.outputs.changed == 'true' && hashFiles('whats-new.md') != ''
        env:
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python scripts/telegram.py

      - name: Cleanup old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L 200 --json databaseId -q '.[].databaseId' | tail -n +91 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :
