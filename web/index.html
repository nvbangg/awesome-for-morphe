<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <script>
      (function () {
        const saved = localStorage.getItem("awesome-morphe-theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        const theme = saved || systemTheme;
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Awesome Morphe Website</title>
    <meta name="description" content="Explore all patch bundles created by the Morphe community." />
    <link rel="canonical" href="https://awesome-morphe.vercel.app/" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Awesome Morphe Website",
        "url": "https://awesome-morphe.vercel.app/",
        "description": "Explore all patch bundles created by the Morphe community."
      }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-80G574QRZ0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-80G574QRZ0");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
